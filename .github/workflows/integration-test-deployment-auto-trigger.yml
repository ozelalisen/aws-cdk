# Unprivileged workflow that runs in the context of the PR when a review is submitted.
# Saves PR metadata and snapshot check result as artifacts for the privileged
# integration-test-deployment-auto.yml workflow (triggered via workflow_run).
#
# This two-stage pattern is required because pull_request_review has no access to
# repository secrets for fork PRs. See pr-linter-review-trigger.yml for precedent.
name: Integration Test Auto Trigger

on:
  pull_request_review:
    types: [submitted]
  # Manual trigger for testing (e.g., when self-approval is not possible on forks)
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to test'
        required: true
      head_sha:
        description: 'Head commit SHA'
        required: true
      base_sha:
        description: 'Base commit SHA'
        required: true
      reviewer:
        description: 'Reviewer login'
        required: true

permissions:
  contents: read

jobs:
  save-pr-info:
    if: github.event_name == 'workflow_dispatch' || github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.head_sha || github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build deployment-integ
        run: yarn --cwd tools/@aws-cdk/integration-test-deployment build

      - name: Check for snapshot changes
        id: check_snapshots
        env:
          TARGET_BRANCH_COMMIT: ${{ github.event.inputs.base_sha || github.event.pull_request.base.sha }}
          SOURCE_BRANCH_COMMIT: ${{ github.event.inputs.head_sha || github.event.pull_request.head.sha }}
        run: |
          if yarn --cwd tools/@aws-cdk/integration-test-deployment check-snapshots; then
            echo "has_snapshots=true" >> $GITHUB_OUTPUT
          else
            echo "has_snapshots=false" >> $GITHUB_OUTPUT
          fi

      - name: Save PR info
        env:
          PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.inputs.head_sha || github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.inputs.base_sha || github.event.pull_request.base.sha }}
          REVIEWER: ${{ github.event.inputs.reviewer || github.event.review.user.login }}
          HAS_SNAPSHOTS: ${{ steps.check_snapshots.outputs.has_snapshots }}
        run: |
          mkdir -p ./pr
          echo "$PR_NUMBER" > ./pr/pr_number
          echo "$HEAD_SHA" > ./pr/head_sha
          echo "$BASE_SHA" > ./pr/base_sha
          echo "$REVIEWER" > ./pr/reviewer
          echo "$HAS_SNAPSHOTS" > ./pr/has_snapshots

      - uses: actions/upload-artifact@v7
        with:
          name: integ_test_pr_info
          path: pr/
